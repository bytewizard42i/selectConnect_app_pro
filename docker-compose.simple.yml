services:
  # Midnight Local Proof Server (simplified)
  midnight-proof-server:
    image: midnightnetwork/proof-server:latest
    container_name: midnight-proof-server
    ports:
      - "127.0.0.1:6300:6300"  # Proof server port (per Midnight docs, localhost only)
    environment:
      - PROOF_SERVER_PORT=6300
      - LOG_LEVEL=info
      - MAX_CIRCUIT_SIZE=2097152  # 2MB max circuit size
      - CACHE_SIZE=1000
      - WORKER_THREADS=2
    networks:
      - selectconnect-network
    command: ["midnight-proof-server", "--network", "testnet"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6300/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis for Relay Service
  redis:
    image: redis:7.4-alpine
    container_name: selectconnect-redis
    ports:
      - "127.0.0.1:6379:6379"  # Only accessible from host
    networks:
      - selectconnect-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  selectconnect-network:
    driver: bridge
