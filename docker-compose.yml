services:
  # Midnight Local Proof Server
  midnight-proof-server:
    image: midnightnetwork/proof-server:latest
    container_name: midnight-proof-server
    ports:
      - "127.0.0.1:6300:6300"  # Proof server port
      - "127.0.0.1:6301:6301"  # Metrics port
    environment:
      - PROOF_SERVER_PORT=6300
      - METRICS_PORT=6301
      - LOG_LEVEL=debug  # Enhanced logging for development
      - MAX_CIRCUIT_SIZE=4194304  # 4MB max circuit size (increased for SelectConnect)
      - CACHE_SIZE=2000  # Increased cache for better performance
      - WORKER_THREADS=8  # More threads for parallel proof generation
      - ENABLE_METRICS=true
      - PROOF_TIMEOUT=300  # 5 minutes timeout for complex proofs
    volumes:
      - ./contracts/build:/circuits  # Mount compiled circuits
      - midnight-proof-cache:/cache
    networks:
      - selectconnect-network
    command: ["midnight-proof-server", "--network", "testnet"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6301/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Midnight Local Node (for testing)
  midnight-node:
    image: midnightnetwork/midnight-node:0.12.1
    container_name: midnight-node
    ports:
      - "127.0.0.1:9944:9944"  # WebSocket RPC (localhost only)
      - "127.0.0.1:9933:9933"  # HTTP RPC (localhost only)
      - "30333:30333"  # P2P (needs external access)
    volumes:
      - midnight-chain-data:/node/chain
    environment:
      - MIDNIGHT_NODE_BASE_PATH=/node/chain
      - MIDNIGHT_NODE_CHAIN=local
      - use_main_chain_follower_mock=true  # Disable Ariadne for local dev
    command: >
      --dev
      --rpc-external
      --ws-external
      --rpc-cors=all
      --pruning=archive
      --base-path=/node/chain
    networks:
      - selectconnect-network
    depends_on:
      - midnight-proof-server
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis for Relay Service
  redis:
    image: redis:7.4-alpine
    container_name: selectconnect-redis
    ports:
      - "127.0.0.1:6379:6379"  # Only accessible from host
    volumes:
      - redis-data:/data
    networks:
      - selectconnect-network
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-selectconnect_redis_2024}
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-selectconnect_redis_2024}"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-selectconnect_redis_2024}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Bull Dashboard for Job Monitoring
  bull-board:
    image: deadly0/bull-board:latest
    container_name: selectconnect-bull-board
    ports:
      - "127.0.0.1:3002:3000"  # Only accessible from host
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-selectconnect_redis_2024}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - selectconnect-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Compact Circuit Compiler
  midnight-compiler:
    image: midnightnetwork/compactc:latest
    container_name: midnight-compiler
    volumes:
      - ./contracts:/workspace
      - ./contracts/build:/output
    working_dir: /workspace
    networks:
      - selectconnect-network
    profiles:
      - tools
    command: ["tail", "-f", "/dev/null"]  # Keep container running for manual compilation

  # Midnight Network Explorer (optional)
  midnight-explorer:
    image: nginx:alpine
    container_name: midnight-explorer
    ports:
      - "127.0.0.1:8080:80"  # Only accessible from host
    volumes:
      - ./tools/explorer:/usr/share/nginx/html:ro
    networks:
      - selectconnect-network
    profiles:
      - tools

volumes:
  midnight-proof-cache:
  midnight-chain-data:
  redis-data:

networks:
  selectconnect-network:
    driver: bridge
